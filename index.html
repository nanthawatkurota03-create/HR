<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>ขอใบลา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14262b;--muted:#5b6b70;--bg:#eef1f4;--card:#fff;--line:#d5dce1;--brand:#0f4c5c;--brand-d:#0a3640;
--warn:#a86a00;--warn-bg:#fdf0d5;--ok:#1a7f4b;--ok-bg:#dcf3e6;--no:#b3261e;--no-bg:#fbe3e1;--idle-bg:#e4e8eb}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;
padding-bottom:env(safe-area-inset-bottom,0)}
[hidden]{display:none!important}
header{background:var(--brand);color:#fff;padding:calc(14px + env(safe-area-inset-top,0)) 16px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:19px;font-weight:600;margin:0}
.hbtns{display:flex;gap:8px;align-items:center}
#installBtn{display:none;background:#fff;color:var(--brand);border:0;border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;font-weight:500}
#hrBtn{background:transparent;color:#fff;border:1px solid #fff;border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;font-weight:500}
#hrBtn:focus-visible,#installBtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
dialog{border:0;border-radius:12px;padding:20px;width:min(360px,92vw);color:var(--ink)}
dialog::backdrop{background:rgba(20,38,43,.5)}
dialog h2{margin:0 0 4px}
.derr{color:var(--no);min-height:22px;margin-top:6px;font-size:14px}
.dact{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.dbtn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:500;min-height:44px}
.dbtn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.dbtn:disabled{opacity:.6}
main{max-width:560px;margin:0 auto;padding:16px}
#netBanner{display:none;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 12px;font-weight:600}
label{display:block;font-size:14px;font-weight:500;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid #b8c3c9;border-radius:8px;padding:10px 12px;min-height:44px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #7fb8c6;outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:400}
.check input{width:20px;min-height:20px;height:20px}
.days{margin-top:12px;padding:10px 12px;background:var(--bg);border-radius:8px;font-weight:500}
.btn{width:100%;margin-top:16px;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:14px;font:inherit;font-weight:600;font-size:17px}
.btn:active{background:var(--brand-d)}
.btn:disabled{opacity:.6}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-of-type{border-top:0;padding-top:0}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.item .t{font-weight:600}
.item .m{color:var(--muted);font-size:14px}
.chip{font-size:13px;font-weight:500;padding:2px 10px;border-radius:99px;white-space:nowrap}
.s-wait{background:var(--warn-bg);color:var(--warn)}
.s-ok{background:var(--ok-bg);color:var(--ok)}
.s-no{background:var(--no-bg);color:var(--no)}
.s-idle{background:var(--idle-bg);color:var(--muted)}
.empty{color:var(--muted);margin:0}
.link{background:none;border:0;color:var(--brand);font:inherit;font-size:14px;font-weight:500;padding:4px 0}
.m{color:var(--muted);font-size:14px}
.who{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.who .n{font-weight:600;font-size:17px}
.who .acts{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.bals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bal{border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;background:#fff}
.bal .bn{font-size:13px;color:var(--muted);line-height:1.3;min-height:34px}
.bal .bv{font-size:26px;font-weight:600;line-height:1.2}
.bal .bv small{font-size:13px;font-weight:400;color:var(--muted)}
.bal .bm{font-size:12px;color:var(--muted)}
.bal.low .bv{color:var(--no)}
.bal .bp{font-size:12px;color:var(--warn);font-weight:500}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;display:none;max-width:90%;font-size:15px;z-index:9}
</style>
</head>
<body>
<header>
  <h1>ขอใบลา</h1>
  <div class="hbtns">
    <button id="installBtn" type="button">ติดตั้งแอป</button>
    <button id="hrBtn" type="button">เข้าสู่ระบบ HR</button>
  </div>
</header>

<dialog id="hrDlg">
  <form id="hrForm" method="dialog">
    <h2>เข้าสู่ระบบ HR</h2>
    <label for="hrPass">รหัสผ่าน HR</label>
    <input id="hrPass" type="password" autocomplete="current-password">
    <div id="hrErr" class="derr" role="alert"></div>
    <div class="dact">
      <button class="dbtn ghost" id="hrCancel" type="button">ยกเลิก</button>
      <button class="dbtn" id="hrGo" type="submit">เข้าสู่ระบบ</button>
    </div>
  </form>
</dialog>

<dialog id="pinDlg">
  <form id="pinForm" method="dialog">
    <h2 id="pinTitle">เปลี่ยน PIN</h2>
    <div class="m" id="pinNote"></div>
    <label for="pinOld">PIN ปัจจุบัน</label>
    <input id="pinOld" type="password" inputmode="numeric" autocomplete="current-password">
    <label for="pinNew">PIN ใหม่ (ตัวเลข 4-8 หลัก)</label>
    <input id="pinNew" type="password" inputmode="numeric" autocomplete="new-password">
    <label for="pinNew2">ยืนยัน PIN ใหม่</label>
    <input id="pinNew2" type="password" inputmode="numeric" autocomplete="new-password">
    <div id="pinErr" class="derr" role="alert"></div>
    <div class="dact">
      <button class="dbtn ghost" id="pinCancel" type="button">ยกเลิก</button>
      <button class="dbtn" id="pinGo" type="submit">บันทึก PIN</button>
    </div>
  </form>
</dialog>

<main>
  <div id="netBanner">ออฟไลน์อยู่ ใบลาจะถูกเก็บไว้และส่งให้อัตโนมัติเมื่อมีสัญญาณ</div>

  <!-- ล็อกอินพนักงาน -->
  <section id="loginBox" hidden>
    <h2>เข้าสู่ระบบ</h2>
    <form id="loginForm" novalidate>
      <label for="lgId">รหัสพนักงาน</label>
      <input id="lgId" autocomplete="username" inputmode="text">
      <label for="lgPin">PIN</label>
      <input id="lgPin" type="password" inputmode="numeric" autocomplete="current-password">
      <div id="lgErr" class="derr" role="alert"></div>
      <button class="btn" id="lgGo" type="submit">เข้าสู่ระบบ</button>
      <p class="m" style="margin:12px 0 0">ยังไม่มี PIN หรือลืม PIN ติดต่อ HR</p>
    </form>
  </section>

  <div id="app" hidden>
    <section>
      <div class="who">
        <div>
          <div class="n" id="whoName"></div>
          <div class="m" id="whoMeta"></div>
        </div>
        <div class="acts">
          <button class="link" id="chPin" type="button">เปลี่ยน PIN</button>
          <button class="link" id="logout" type="button">ออกจากระบบ</button>
        </div>
      </div>
    </section>

    <section>
      <h2 id="balTitle">ยอดวันลาคงเหลือ</h2>
      <div class="bals" id="bals"></div>
      <div class="m" id="balMeta" style="margin-top:8px"></div>
    </section>

    <section>
      <h2>กรอกใบลา</h2>
      <form id="f" novalidate>
        <label for="type">ประเภทการลา</label>
        <select id="type">
          <option>01 ลาป่วย</option>
          <option>02 ลากิจ</option>
          <option>03 วันหยุดพักผ่อนประจำปี</option>
          <option>04 ลาเพื่อทหาร</option>
          <option>05 ลาเพื่อทำหมัน</option>
          <option>06 ขาดงานหัก 1 เท่า</option>
          <option>07 ลาอุปสมบท</option>
          <option>08 ลาคลอด</option>
          <option>09 ลาสมรส</option>
          <option>10 ขาดงานหัก 2 เท่า</option>
          <option>11 ลาฌาปนกิจ</option>
          <option>12 วันหยุดพักผ่อนประจำปีตามแผน</option>
          <option>13 หยุดพิเศษ</option>
        </select>
        <div class="m" id="typeHint"></div>
        <div class="row">
          <div><label for="start">ตั้งแต่วันที่</label><input id="start" type="date" required></div>
          <div><label for="end">ถึงวันที่</label><input id="end" type="date" required></div>
        </div>
        <label class="check" for="half"><input id="half" type="checkbox" disabled> ลาครึ่งวัน (เลือกได้เมื่อลาวันเดียว)</label>
        <div class="days" id="days">จำนวนวันลา: -</div>
        <label for="reason">เหตุผลการลา</label><textarea id="reason" required></textarea>
        <label for="phone">เบอร์ติดต่อระหว่างลา</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel">
        <button class="btn" id="submit" type="submit">ส่งใบลาให้ HR</button>
      </form>
    </section>

    <section>
      <div class="top" style="display:flex;justify-content:space-between;align-items:center">
        <h2 style="margin:0">ใบลาของฉัน</h2>
        <button class="link" id="refresh" type="button">อัปเดตสถานะ</button>
      </div>
      <div id="list" style="margin-top:12px"></div>
    </section>
  </div>
</main>
<div id="toast" role="status"></div>

<script>
// วาง URL ของ Apps Script Web App ตรงนี้ (ลงท้ายด้วย /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbyohtDVshSFXMEmf93Q893hA7kYBVBzjWcWqc0KPb1Z6YiWIpd6rdmrMHg5GjermPCuUw/exec';

const $ = s => document.querySelector(s);
const LS = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const apiReady = () => !API_URL.includes('PASTE_');

// S = เซสชันที่ล็อกอินอยู่ { token, emp:{id,name,dept,phone,mustChange}, year, balances:[...] }
let S = LS.get('session', null);
let reqs = [];
const reqKey = () => 'reqs:' + S.emp.id;
const saveReqs = () => LS.set(reqKey(), reqs);
const saveSession = () => LS.set('session', S);

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3600);
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fmtDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return d + '/' + m + '/' + (y + 543);
}
const fmtN = n => String(+Number(n).toFixed(2));

async function api(body) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  return res.json();
}

// ----- แสดง/ซ่อนหน้า -----
function showLogin(msg) {
  $('#loginBox').hidden = false; $('#app').hidden = true;
  $('#lgErr').textContent = msg || '';
  const last = LS.get('lastEmpId', '');
  if (last && !$('#lgId').value) $('#lgId').value = last;
}
function showApp() {
  $('#loginBox').hidden = true; $('#app').hidden = false;
  $('#whoName').textContent = S.emp.name;
  $('#whoMeta').textContent = 'รหัส ' + S.emp.id + (S.emp.dept ? ' · แผนก ' + S.emp.dept : '');
  if (S.emp.phone && !$('#phone').value) $('#phone').value = S.emp.phone;
  renderBalances(); renderHint(); render();
}

// ----- ยอดวันลา -----
function renderBalances() {
  const el = $('#bals');
  const b = S.balances || [];
  $('#balTitle').textContent = 'ยอดวันลาคงเหลือ ปี ' + (S.year ? S.year + 543 : '');
  if (!b.length) { el.innerHTML = '<p class="empty" style="grid-column:1/-1">ยังไม่มีข้อมูลยอดวันลา (ต้องออนไลน์เพื่อดึงข้อมูล)</p>'; $('#balMeta').textContent = ''; return; }
  el.innerHTML = b.map(x => {
    const avail = x.remaining - x.pending;
    return '<div class="bal' + (avail <= 0 ? ' low' : '') + '"><div class="bn">' + esc(x.name) + '</div>' +
      '<div class="bv">' + fmtN(x.remaining) + ' <small>วัน</small></div>' +
      '<div class="bm">ใช้ไป ' + fmtN(x.used) + ' / สิทธิ์ ' + fmtN(x.total) + '</div>' +
      (x.pending > 0 ? '<div class="bp">รออนุมัติ ' + fmtN(x.pending) + ' วัน</div>' : '') + '</div>';
  }).join('');
  $('#balMeta').textContent = 'ยอดคงเหลือหักเมื่อ HR อนุมัติใบลาแล้ว';
}
function balOf(type) { return (S.balances || []).find(x => x.code === type.slice(0, 2)); }
function renderHint() {
  const b = balOf($('#type').value);
  $('#typeHint').textContent = b ? 'คงเหลือที่ลาได้ ' + fmtN(b.remaining - b.pending) + ' วัน' + (b.pending > 0 ? ' (หักใบที่รออนุมัติแล้ว)' : '') : '';
}
$('#type').addEventListener('input', renderHint);

// ----- คำนวณจำนวนวัน -----
function calcDays() {
  const s = $('#start').value, e = $('#end').value;
  const half = $('#half');
  half.disabled = !(s && e && s === e);
  if (half.disabled) half.checked = false;
  if (!s || !e) { $('#days').textContent = 'จำนวนวันลา: -'; return null; }
  if (e < s) { $('#days').textContent = 'วันที่สิ้นสุดต้องไม่ก่อนวันที่เริ่ม'; return null; }
  const n = (new Date(e) - new Date(s)) / 86400000 + 1;
  const days = half.checked ? 0.5 : n;
  $('#days').textContent = 'จำนวนวันลา: ' + days + ' วัน';
  return days;
}
['start', 'end', 'half'].forEach(id => $('#' + id).addEventListener('input', calcDays));

// ----- ส่งข้อมูล -----
// คืนค่า: true = ส่งสำเร็จ, 'perm' = ระบบปฏิเสธถาวร (เช่น เกินยอด), 'auth' = ต้องล็อกอินใหม่, false = ลองใหม่ภายหลัง
async function send(r) {
  if (!apiReady() || !navigator.onLine || !S) return false;
  try {
    const j = await api({ action: 'submit', token: S.token, cid: r.cid, type: r.type, start: r.start, end: r.end,
      half: r.half, reason: r.reason, phone: r.phone });
    if (j.ok) {
      r.synced = true; r.no = j.no; r.status = j.status;
      if (j.balances) { S.balances = j.balances; saveSession(); renderBalances(); renderHint(); }
      saveReqs(); render(); return true;
    }
    if (j.error === 'auth') return 'auth';
    if (/^(balance|invalid|missing)/.test(String(j.error))) {
      r.synced = true; r.status = 'ส่งไม่สำเร็จ'; r.err = j.message || j.error;
      saveReqs(); render();
      toast(r.err);
      return 'perm';
    }
  } catch (e) {}
  return false;
}
async function flush() {
  if (!S) return;
  for (const r of reqs.filter(x => !x.synced)) {
    const ok = await send(r);
    if (ok === 'auth') { expire(); return; }
    if (ok !== true && ok !== 'perm') break;
  }
}

// ----- โหลดข้อมูลของฉันจากเซิร์ฟเวอร์ (ยอดวันลา + สถานะใบลา) -----
function mergeRequests(list) {
  (list || []).forEach(sr => {
    const lr = reqs.find(x => x.cid === sr.cid);
    if (lr) { lr.status = sr.status; lr.no = sr.no; lr.synced = true; return; }
    reqs.push({ cid: sr.cid, type: sr.type, start: sr.start, end: sr.end, days: sr.days, status: sr.status,
      no: sr.no, synced: true, createdAt: sr.ts || '' });
  });
  reqs.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  reqs = reqs.slice(0, 80);
}
function applyProfile(j) {
  S.emp = j.emp; S.year = j.year; S.balances = j.balances;
  saveSession();
  mergeRequests(j.requests);
  saveReqs();
  showApp();
}
async function loadMe(manual) {
  if (!S) return;
  if (!apiReady() || !navigator.onLine) { if (manual) toast('ออฟไลน์อยู่'); return; }
  try {
    const j = await api({ action: 'me', token: S.token });
    if (j.ok) { applyProfile(j); if (manual) toast('อัปเดตแล้ว'); }
    else if (j.error === 'auth') expire();
  } catch (e) { if (manual) toast('อัปเดตไม่สำเร็จ ลองใหม่อีกครั้ง'); }
}
function expire() {
  LS.del('session'); S = null; reqs = [];
  showLogin('เซสชันหมดอายุหรือ PIN ถูกเปลี่ยน กรุณาเข้าสู่ระบบใหม่');
}

// ----- ล็อกอิน / ออกจากระบบ -----
$('#loginForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const id = $('#lgId').value.trim(), pin = $('#lgPin').value.trim();
  if (!id || !pin) { $('#lgErr').textContent = 'กรอกรหัสพนักงานและ PIN'; return; }
  if (!apiReady()) { $('#lgErr').textContent = 'ยังไม่ได้ตั้งค่า API_URL ใน index.html'; return; }
  if (!navigator.onLine) { $('#lgErr').textContent = 'ออฟไลน์อยู่ ต้องมีอินเทอร์เน็ตเพื่อเข้าสู่ระบบ'; return; }
  $('#lgGo').disabled = true; $('#lgErr').textContent = '';
  try {
    const j = await api({ action: 'login', empId: id, pin: pin });
    if (j.ok) {
      S = { token: j.token, emp: j.emp, year: j.year, balances: j.balances };
      saveSession(); LS.set('lastEmpId', id);
      reqs = LS.get(reqKey(), []);
      // ย้ายใบลาเก่าที่เคยเก็บไว้ในเครื่อง (ก่อนมีระบบล็อกอิน) ของคนนี้เข้ามา
      const legacy = LS.get('reqs', []);
      const mine = legacy.filter(r => String(r.empId) === id && !reqs.some(x => x.cid === r.cid));
      if (legacy.length) {
        reqs = reqs.concat(mine);
        LS.set('reqs', legacy.filter(r => String(r.empId) !== id));
      }
      $('#lgPin').value = '';
      mergeRequests(j.requests); saveReqs(); showApp();
      if (j.emp.mustChange) openPin(true);
      flush();
    } else if (j.error === 'locked') {
      $('#lgErr').textContent = 'กรอก PIN ผิดหลายครั้ง ลองใหม่ในอีก 15 นาที หรือติดต่อ HR';
    } else if (j.error === 'auth') {
      $('#lgErr').textContent = 'รหัสพนักงานหรือ PIN ไม่ถูกต้อง (ถ้ายังไม่มี PIN ติดต่อ HR)';
    } else {
      $('#lgErr').textContent = 'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง';
    }
  } catch (e) { $('#lgErr').textContent = 'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง'; }
  $('#lgGo').disabled = false;
});
$('#logout').addEventListener('click', () => {
  const pending = reqs.filter(r => !r.synced).length;
  if (pending && !confirm('มีใบลา ' + pending + ' ฉบับที่ยังไม่ได้ส่ง ออกจากระบบแล้วจะส่งต่อเมื่อเข้าสู่ระบบอีกครั้ง ออกจากระบบ?')) return;
  LS.del('session'); S = null; reqs = [];
  $('#lgPin').value = '';
  showLogin('');
});

// ----- เปลี่ยน PIN -----
let pinForced = false;
function openPin(forced) {
  pinForced = !!forced;
  $('#pinTitle').textContent = forced ? 'ตั้ง PIN ใหม่ก่อนใช้งาน' : 'เปลี่ยน PIN';
  $('#pinNote').textContent = forced ? 'HR ตั้ง PIN เริ่มต้นให้ กรุณาเปลี่ยนเป็น PIN ของคุณเอง' : '';
  $('#pinCancel').hidden = pinForced;
  ['#pinOld', '#pinNew', '#pinNew2'].forEach(s => $(s).value = '');
  $('#pinErr').textContent = '';
  $('#pinDlg').showModal(); $('#pinOld').focus();
}
$('#chPin').addEventListener('click', () => openPin(false));
$('#pinCancel').addEventListener('click', () => $('#pinDlg').close());
$('#pinDlg').addEventListener('cancel', ev => { if (pinForced) ev.preventDefault(); });
$('#pinForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const o = $('#pinOld').value.trim(), n = $('#pinNew').value.trim(), n2 = $('#pinNew2').value.trim();
  if (!/^\d{4,8}$/.test(n)) { $('#pinErr').textContent = 'PIN ใหม่ต้องเป็นตัวเลข 4-8 หลัก'; return; }
  if (n !== n2) { $('#pinErr').textContent = 'PIN ใหม่ทั้งสองช่องไม่ตรงกัน'; return; }
  if (!navigator.onLine) { $('#pinErr').textContent = 'ออฟไลน์อยู่ ต้องมีอินเทอร์เน็ต'; return; }
  $('#pinGo').disabled = true; $('#pinErr').textContent = '';
  try {
    const j = await api({ action: 'changePin', token: S.token, oldPin: o, newPin: n });
    if (j.ok) {
      S.token = j.token; S.emp.mustChange = false; saveSession();
      pinForced = false; $('#pinDlg').close(); toast('เปลี่ยน PIN แล้ว');
    } else if (j.error === 'oldpin') $('#pinErr').textContent = 'PIN ปัจจุบันไม่ถูกต้อง';
    else if (j.error === 'auth') { pinForced = false; $('#pinDlg').close(); expire(); }
    else $('#pinErr').textContent = 'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง';
  } catch (e) { $('#pinErr').textContent = 'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง'; }
  $('#pinGo').disabled = false;
});

// ----- ส่งใบลา -----
$('#f').addEventListener('submit', async ev => {
  ev.preventDefault();
  if (!S) return;
  const days = calcDays();
  const v = id => $('#' + id).value.trim();
  if (!v('start') || !v('end') || !v('reason')) { toast('กรอกข้อมูลที่จำเป็นให้ครบ'); return; }
  if (days === null) { toast('ตรวจสอบวันที่ลาอีกครั้ง'); return; }
  if (!apiReady()) { toast('ยังไม่ได้ตั้งค่า API_URL ใน index.html'); return; }
  const b = balOf($('#type').value);
  if (b && navigator.onLine && days > b.remaining - b.pending) {
    toast('ขอลา ' + days + ' วัน แต่ยอด' + b.name + 'ที่ลาได้เหลือ ' + fmtN(b.remaining - b.pending) + ' วัน');
    return;
  }
  const r = {
    cid: crypto.randomUUID(), type: $('#type').value,
    start: v('start'), end: v('end'), days, half: $('#half').checked, reason: v('reason'), phone: v('phone'),
    createdAt: new Date().toISOString(), synced: false, status: 'รอส่ง', no: ''
  };
  reqs.unshift(r); saveReqs(); render();
  $('#submit').disabled = true;
  const ok = await send(r);
  $('#submit').disabled = false;
  if (ok === 'auth') { expire(); return; }
  if (ok === true) toast('ส่งใบลาให้ HR แล้ว');
  else if (ok === false) toast('ยังส่งไม่ได้ เก็บไว้แล้ว จะส่งให้เมื่อมีสัญญาณ');
  if (ok !== 'perm') { $('#start').value = $('#end').value = $('#reason').value = ''; $('#half').checked = false; calcDays(); }
});

// ----- แสดงรายการ -----
function render() {
  if (!S) return;
  const el = $('#list');
  if (!reqs.length) { el.innerHTML = '<p class="empty">ยังไม่มีใบลา กรอกฟอร์มด้านบนเพื่อส่งใบลาฉบับแรก</p>'; return; }
  const cls = { 'รออนุมัติ': 's-wait', 'อนุมัติ': 's-ok', 'ไม่อนุมัติ': 's-no', 'รอส่ง': 's-idle', 'ส่งไม่สำเร็จ': 's-no' };
  el.innerHTML = reqs.map(r => {
    const range = r.start === r.end ? fmtDate(r.start) : fmtDate(r.start) + ' - ' + fmtDate(r.end);
    return '<div class="item"><div class="top"><div><div class="t">' + esc(r.type) + ' ' + r.days + ' วัน</div>' +
      '<div class="m">' + range + '</div>' + (r.no ? '<div class="m">เลขที่ ' + esc(r.no) + '</div>' : '') +
      (r.err ? '<div class="m" style="color:var(--no)">' + esc(r.err) + '</div>' : '') + '</div>' +
      '<span class="chip ' + (cls[r.status] || 's-idle') + '">' + esc(r.status) + '</span></div></div>';
  }).join('');
}
$('#refresh').addEventListener('click', () => loadMe(true));

// ----- ออนไลน์/ออฟไลน์ -----
function net() { $('#netBanner').style.display = navigator.onLine ? 'none' : 'block'; }
window.addEventListener('online', () => { net(); flush().then(() => loadMe(false)); });
window.addEventListener('offline', net);

// ----- เข้าสู่ระบบ HR (ปุ่มมุมขวาบน) -----
$('#hrBtn').addEventListener('click', () => { $('#hrErr').textContent = ''; $('#hrPass').value = ''; $('#hrDlg').showModal(); $('#hrPass').focus(); });
$('#hrCancel').addEventListener('click', () => $('#hrDlg').close());
$('#hrForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const pass = $('#hrPass').value;
  if (!pass) { $('#hrErr').textContent = 'กรอกรหัสผ่าน'; return; }
  if (!apiReady()) { $('#hrErr').textContent = 'ยังไม่ได้ตั้งค่า API_URL ใน index.html'; return; }
  if (!navigator.onLine) { $('#hrErr').textContent = 'ออฟไลน์อยู่ ต้องมีอินเทอร์เน็ตเพื่อเข้าสู่ระบบ HR'; return; }
  $('#hrGo').disabled = true; $('#hrErr').textContent = '';
  try {
    const j = await api({ action: 'hrList', passcode: pass });
    if (j.ok) {
      try { sessionStorage.setItem('hrpass', pass); } catch (e) {}
      location.href = 'hr/index.html';
      return;
    }
    $('#hrErr').textContent = j.error === 'auth' ? 'รหัสผ่านไม่ถูกต้อง' : 'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง';
  } catch (e) { $('#hrErr').textContent = 'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง'; }
  $('#hrGo').disabled = false;
});

// ----- PWA -----
let deferred;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('#installBtn').style.display = 'block'; });
$('#installBtn').addEventListener('click', async () => {
  if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $('#installBtn').style.display = 'none';
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

// ----- เริ่มต้น -----
net(); calcDays();
if (S && S.token && S.emp) {
  reqs = LS.get(reqKey(), []);
  showApp();
  if (S.emp.mustChange && navigator.onLine) openPin(true);
  flush().then(() => loadMe(false));
} else {
  S = null; showLogin('');
}
</script>
</body>
</html>
