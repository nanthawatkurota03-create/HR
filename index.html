<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>ขอใบลา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14262b;--muted:#5b6b70;--bg:#eef1f4;--card:#fff;--line:#d5dce1;--brand:#0f4c5c;--brand-d:#0a3640;
--warn:#a86a00;--warn-bg:#fdf0d5;--ok:#1a7f4b;--ok-bg:#dcf3e6;--no:#b3261e;--no-bg:#fbe3e1;--idle-bg:#e4e8eb}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0)}
[hidden]{display:none!important}
header{background:var(--brand);color:#fff;padding:calc(14px + env(safe-area-inset-top,0)) 16px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:19px;font-weight:600;margin:0}
.hbtns{display:flex;gap:8px;align-items:center}
#installBtn{display:none;background:#fff;color:var(--brand);border:0;border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;font-weight:500}
#hrLink{color:#fff;border:1px solid #fff;border-radius:8px;padding:6px 12px;font-size:14px;font-weight:500;text-decoration:none}
dialog{border:0;border-radius:12px;padding:20px;width:min(360px,92vw);color:var(--ink)}
dialog::backdrop{background:rgba(20,38,43,.5)}
dialog h2{margin:0 0 4px}
.derr{color:var(--no);min-height:22px;margin-top:6px;font-size:14px}
.dact{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.dbtn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:500;min-height:44px}
.dbtn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.dbtn:disabled{opacity:.6}
main{max-width:560px;margin:0 auto;padding:16px}
#netBanner{display:none;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 12px;font-weight:600}
label{display:block;font-size:14px;font-weight:500;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid #b8c3c9;border-radius:8px;padding:10px 12px;min-height:44px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid #7fb8c6;outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:400}
.check input{width:20px;min-height:20px;height:20px}
.days{margin-top:12px;padding:10px 12px;background:var(--bg);border-radius:8px;font-weight:500}
.btn{width:100%;margin-top:16px;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:14px;font:inherit;font-weight:600;font-size:17px}
.btn:disabled{opacity:.6}
.link{background:none;border:0;color:var(--brand);font:inherit;font-size:14px;font-weight:500;padding:4px 0}
.m{color:var(--muted);font-size:14px}
.empty{color:var(--muted);margin:0}
.who{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.who .n{font-weight:600;font-size:17px}
.who .acts{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:2px solid var(--line)}
.tab{background:none;border:0;font:inherit;font-weight:500;color:var(--muted);padding:10px 16px;border-bottom:3px solid transparent;margin-bottom:-2px;min-height:44px}
.tab[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}
.bd{background:var(--no);color:#fff;border-radius:99px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;padding:0 6px;margin-left:4px}
.item{border-top:1px solid var(--line);padding:14px 0}
.item:first-child{border-top:0;padding-top:0}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.item .t{font-weight:600}
.chip{font-size:13px;font-weight:500;padding:2px 10px;border-radius:99px;white-space:nowrap}
.s-wait{background:var(--warn-bg);color:var(--warn)}.s-ok{background:var(--ok-bg);color:var(--ok)}.s-no{background:var(--no-bg);color:var(--no)}.s-idle{background:var(--idle-bg);color:var(--muted)}
.tl{list-style:none;margin:12px 0 0;padding:0}
.tl li{position:relative;padding:0 0 12px 24px;font-size:14px}
.tl li::before{content:"";position:absolute;left:5px;top:14px;bottom:-2px;width:2px;background:var(--line)}
.tl li:last-child{padding-bottom:0}.tl li:last-child::before{display:none}
.tl i{position:absolute;left:0;top:4px;width:12px;height:12px;border-radius:50%;border:2px solid #b8c3c9;background:#fff}
.tl b{display:block;font-weight:600}.tl span{color:var(--muted)}
.tl .d i{background:var(--ok);border-color:var(--ok)}
.tl .c i{background:var(--warn);border-color:var(--warn)}.tl .c span{color:var(--warn);font-weight:500}
.tl .n i{background:var(--no);border-color:var(--no)}.tl .n span{color:var(--no)}
.acts2{display:flex;gap:12px;margin-top:12px}
.bt{flex:1;height:52px;border-radius:10px;font:inherit;font-weight:600;font-size:17px}
.bt.ok{border:0;background:var(--ok);color:#fff}
.bt.no{border:2px solid var(--no);background:#fff;color:var(--no)}
.fl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;font-size:14px;border-bottom:1px solid var(--line)}
.fl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl .link{flex:none}
.att{margin-top:8px;display:flex;flex-direction:column;align-items:flex-start}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;display:none;max-width:90%;font-size:15px;z-index:9}
</style>
</head>
<body>
<header>
  <h1>ขอใบลา</h1>
  <div class="hbtns">
    <button id="installBtn" type="button">ติดตั้งแอป</button>
    <a id="hrLink" href="hr/index.html">สำหรับ HR</a>
  </div>
</header>

<dialog id="pinDlg">
  <form id="pinForm" method="dialog">
    <h2 id="pinTitle">เปลี่ยน PIN</h2>
    <div class="m" id="pinNote"></div>
    <label for="pinOld">PIN ปัจจุบัน</label>
    <input id="pinOld" type="password" inputmode="numeric" autocomplete="current-password">
    <label for="pinNew">PIN ใหม่ (ตัวเลข 4-8 หลัก)</label>
    <input id="pinNew" type="password" inputmode="numeric" autocomplete="new-password">
    <label for="pinNew2">ยืนยัน PIN ใหม่</label>
    <input id="pinNew2" type="password" inputmode="numeric" autocomplete="new-password">
    <div id="pinErr" class="derr" role="alert"></div>
    <div class="dact">
      <button class="dbtn ghost" id="pinCancel" type="button">ยกเลิก</button>
      <button class="dbtn" id="pinGo" type="submit">บันทึก PIN</button>
    </div>
  </form>
</dialog>

<main>
  <div id="netBanner">ออฟไลน์อยู่ ต้องมีอินเทอร์เน็ตเพื่อส่งใบลาและดูสถานะ</div>

  <section id="loginBox" hidden>
    <h2>เข้าสู่ระบบ</h2>
    <form id="loginForm" novalidate>
      <label for="lgId">รหัสพนักงาน</label>
      <input id="lgId" autocomplete="username" inputmode="text">
      <label for="lgPin">PIN</label>
      <input id="lgPin" type="password" inputmode="numeric" autocomplete="current-password">
      <div id="lgErr" class="derr" role="alert"></div>
      <button class="btn" id="lgGo" type="submit">เข้าสู่ระบบ</button>
      <p class="m" style="margin:12px 0 0">ยังไม่มี PIN หรือลืม PIN ติดต่อ HR</p>
    </form>
  </section>

  <div id="app" hidden>
    <section>
      <div class="who">
        <div><div class="n" id="whoName"></div><div class="m" id="whoMeta"></div><div class="m" id="chainInfo"></div></div>
        <div class="acts">
          <button class="link" id="chPin" type="button">เปลี่ยน PIN</button>
          <button class="link" id="logout" type="button">ออกจากระบบ</button>
        </div>
      </div>
    </section>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tReq" aria-selected="true" type="button">ขอใบลา</button>
      <button class="tab" role="tab" id="tInbox" aria-selected="false" type="button" hidden>รออนุมัติ<span class="bd" id="tBadge" hidden></span></button>
    </div>

    <div id="vReq">
      <section>
        <h2>กรอกใบลา</h2>
        <form id="f" novalidate>
          <label for="type">ประเภทการลา</label>
          <select id="type">
            <option>01 ลาป่วย</option>
            <option>02 ลากิจ</option>
            <option>03 วันหยุดพักผ่อนประจำปี</option>
            <option>04 ลาเพื่อทหาร</option>
            <option>05 ลาเพื่อทำหมัน</option>
            <option>06 ขาดงานหัก 1 เท่า</option>
            <option>07 ลาอุปสมบท</option>
            <option>08 ลาคลอด</option>
            <option>09 ลาสมรส</option>
            <option>10 ขาดงานหัก 2 เท่า</option>
            <option>11 ลาฌาปนกิจ</option>
            <option>12 วันหยุดพักผ่อนประจำปีตามแผน</option>
            <option>13 หยุดพิเศษ</option>
          </select>
          <div class="row">
            <div><label for="start">ตั้งแต่วันที่</label><input id="start" type="date" required></div>
            <div><label for="end">ถึงวันที่</label><input id="end" type="date" required></div>
          </div>
          <label class="check" for="half"><input id="half" type="checkbox" disabled> ลาครึ่งวัน (เลือกได้เมื่อลาวันเดียว)</label>
          <div class="days" id="days">จำนวนวันลา: -</div>
          <label for="reason">เหตุผลการลา</label><textarea id="reason" required></textarea>
          <label for="phone">เบอร์ติดต่อระหว่างลา</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel">
          <label>ไฟล์แนบ (รูป / PDF / Word สูงสุด 3 ไฟล์)</label>
          <div id="fileList"></div>
          <button class="link" id="addFile" type="button">+ เพิ่มไฟล์</button>
          <input id="fileIn" type="file" multiple accept="image/*,.pdf,.doc,.docx" hidden>
          <button class="btn" id="submit" type="submit">ส่งใบลา</button>
        </form>
      </section>
      <section>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h2 style="margin:0">ใบลาของฉัน</h2>
          <button class="link" id="refresh" type="button">อัปเดตสถานะ</button>
        </div>
        <div id="list" style="margin-top:12px"></div>
      </section>
    </div>

    <div id="vInbox" hidden>
      <section>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h2 style="margin:0">รอการอนุมัติของฉัน</h2>
          <button class="link" id="iRefresh" type="button">โหลดใหม่</button>
        </div>
        <div id="iList" style="margin-top:12px"></div>
      </section>
    </div>
  </div>
</main>
<div id="toast" role="status"></div>

<script>
// URL ของ Apps Script Web App (ลงท้ายด้วย /exec) ใช้ตัวเดียวกันในทุกไฟล์
const API_URL = 'https://script.google.com/macros/s/AKfycbw89zZuaEeZe6lNygue9yl1wb2W8u3opwFwKdAgDyYOuSwtv2Trpi6hZIxzDiq-EtH59w/exec';

const $ = s => document.querySelector(s);
const LS = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
let S = LS.get('session', null); // { token, emp, chain, isApprover, inbox }
let sendCid = null;

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 3600);
}
const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; };
function fmtDate(s) { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return d + '/' + m + '/' + (y + 543); }
function fmtTs(s) { const d = new Date(s); return isNaN(d) ? '' : d.toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' }); }
const rangeTxt = r => r.start === r.end ? fmtDate(r.start) : fmtDate(r.start) + ' - ' + fmtDate(r.end);
const isOpen = st => String(st).indexOf('รอ') === 0;
async function api(body) {
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return res.json();
}
const save = () => LS.set('session', S);

// ----- แสดงหน้า -----
function showLogin(msg) {
  $('#loginBox').hidden = false; $('#app').hidden = true;
  $('#lgErr').textContent = msg || '';
  const last = LS.get('lastEmpId', '');
  if (last && !$('#lgId').value) $('#lgId').value = last;
}
function showApp() {
  $('#loginBox').hidden = true; $('#app').hidden = false;
  $('#whoName').textContent = S.emp.name;
  $('#whoMeta').textContent = 'รหัส ' + S.emp.id + (S.emp.dept ? ' · แผนก ' + S.emp.dept : '');
  $('#chainInfo').textContent = S.chain ? 'ลำดับอนุมัติ: ' + S.chain.map(c => c.role === 'HR' ? 'HR' : c.role + ' (' + c.name + ')').join(' → ') : '';
  if (S.emp.phone && !$('#phone').value) $('#phone').value = S.emp.phone;
  $('#tInbox').hidden = !S.isApprover;
  const b = $('#tBadge'); b.hidden = !(S.inbox > 0); b.textContent = S.inbox;
  if (!S.isApprover) tab('req');
}
function tab(w) {
  $('#tReq').setAttribute('aria-selected', w === 'req'); $('#tInbox').setAttribute('aria-selected', w === 'inbox');
  $('#vReq').hidden = w !== 'req'; $('#vInbox').hidden = w !== 'inbox';
  if (w === 'inbox') loadInbox(); else loadMine();
}
$('#tReq').addEventListener('click', () => tab('req'));
$('#tInbox').addEventListener('click', () => tab('inbox'));
function expire() { LS.del('session'); S = null; showLogin('เซสชันหมดอายุหรือ PIN ถูกเปลี่ยน กรุณาเข้าสู่ระบบใหม่'); }
const authFail = j => { if (j && j.error === 'auth') { expire(); return true; } return false; };
function setProfile(j) {
  S.emp = j.emp; S.chain = j.chain; S.isApprover = j.isApprover; S.inbox = j.inbox; save(); showApp();
}
async function loadMe() {
  if (!S || !navigator.onLine) return;
  try { const j = await api({ action: 'me', token: S.token }); if (j.ok) setProfile(j); else authFail(j); } catch (e) {}
}

// ----- ล็อกอิน / ออกจากระบบ -----
$('#loginForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const id = $('#lgId').value.trim(), pin = $('#lgPin').value.trim();
  if (!id || !pin) { $('#lgErr').textContent = 'กรอกรหัสพนักงานและ PIN'; return; }
  if (!navigator.onLine) { $('#lgErr').textContent = 'ออฟไลน์อยู่ ต้องมีอินเทอร์เน็ตเพื่อเข้าสู่ระบบ'; return; }
  $('#lgGo').disabled = true; $('#lgErr').textContent = '';
  try {
    const j = await api({ action: 'login', empId: id, pin: pin });
    if (j.ok) {
      S = { token: j.token }; LS.set('lastEmpId', id); $('#lgPin').value = '';
      setProfile(j); loadMine();
      if (j.emp.mustChange) openPin(true);
    } else if (j.error === 'locked') $('#lgErr').textContent = 'กรอก PIN ผิดหลายครั้ง ลองใหม่ในอีก 15 นาที หรือติดต่อ HR';
    else if (j.error === 'auth') $('#lgErr').textContent = 'รหัสพนักงานหรือ PIN ไม่ถูกต้อง (ถ้ายังไม่มี PIN ติดต่อ HR)';
    else $('#lgErr').textContent = 'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง';
  } catch (e) { $('#lgErr').textContent = 'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง'; }
  $('#lgGo').disabled = false;
});
$('#logout').addEventListener('click', () => { LS.del('session'); S = null; $('#lgPin').value = ''; showLogin(''); });

// ----- เปลี่ยน PIN -----
let pinForced = false;
function openPin(forced) {
  pinForced = !!forced;
  $('#pinTitle').textContent = forced ? 'ตั้ง PIN ใหม่ก่อนใช้งาน' : 'เปลี่ยน PIN';
  $('#pinNote').textContent = forced ? 'HR ตั้ง PIN เริ่มต้นให้ กรุณาเปลี่ยนเป็น PIN ของคุณเอง' : '';
  $('#pinCancel').hidden = pinForced;
  ['#pinOld', '#pinNew', '#pinNew2'].forEach(s => $(s).value = '');
  $('#pinErr').textContent = ''; $('#pinDlg').showModal(); $('#pinOld').focus();
}
$('#chPin').addEventListener('click', () => openPin(false));
$('#pinCancel').addEventListener('click', () => $('#pinDlg').close());
$('#pinDlg').addEventListener('cancel', ev => { if (pinForced) ev.preventDefault(); });
$('#pinForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const o = $('#pinOld').value.trim(), n = $('#pinNew').value.trim(), n2 = $('#pinNew2').value.trim();
  if (!/^\d{4,8}$/.test(n)) { $('#pinErr').textContent = 'PIN ใหม่ต้องเป็นตัวเลข 4-8 หลัก'; return; }
  if (n !== n2) { $('#pinErr').textContent = 'PIN ใหม่ทั้งสองช่องไม่ตรงกัน'; return; }
  if (!navigator.onLine) { $('#pinErr').textContent = 'ออฟไลน์อยู่ ต้องมีอินเทอร์เน็ต'; return; }
  $('#pinGo').disabled = true; $('#pinErr').textContent = '';
  try {
    const j = await api({ action: 'changePin', token: S.token, oldPin: o, newPin: n });
    if (j.ok) { S.token = j.token; S.emp.mustChange = false; save(); pinForced = false; $('#pinDlg').close(); toast('เปลี่ยน PIN แล้ว'); }
    else if (j.error === 'oldpin') $('#pinErr').textContent = 'PIN ปัจจุบันไม่ถูกต้อง';
    else if (j.error === 'auth') { pinForced = false; $('#pinDlg').close(); expire(); }
    else $('#pinErr').textContent = 'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง';
  } catch (e) { $('#pinErr').textContent = 'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง'; }
  $('#pinGo').disabled = false;
});

// ----- ไฟล์แนบ -----
const MAX_FILES = 3, MAX_DOC = 4 * 1024 * 1024;
let F = [];
function renderFiles() {
  $('#fileList').innerHTML = F.map((f, i) => '<div class="fl"><span>' + esc(f.name) + '</span><button class="link" data-rm="' + i + '" type="button">ลบ</button></div>').join('');
  $('#addFile').hidden = F.length >= MAX_FILES;
}
$('#addFile').addEventListener('click', () => $('#fileIn').click());
$('#fileIn').addEventListener('change', ev => {
  for (const f of ev.target.files) {
    if (F.length >= MAX_FILES) { toast('แนบได้สูงสุด ' + MAX_FILES + ' ไฟล์'); break; }
    if (!f.type.startsWith('image/') && f.size > MAX_DOC) { toast(f.name + ' ใหญ่เกิน 4 MB'); continue; }
    F.push(f);
  }
  ev.target.value = ''; renderFiles();
});
$('#fileList').addEventListener('click', ev => { const b = ev.target.closest('[data-rm]'); if (b) { F.splice(+b.dataset.rm, 1); renderFiles(); } });
const b64 = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(blob); });
async function packFile(f) {
  if (!f.type.startsWith('image/')) return { name: f.name, type: f.type, data: await b64(f) };
  const bmp = await createImageBitmap(f, { imageOrientation: 'from-image' }); // ย่อรูปเหลือด้านยาวไม่เกิน 1600px
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.75));
  return { name: f.name.replace(/\.[^.]+$/, '') + '.jpg', type: 'image/jpeg', data: await b64(blob) };
}
const attHtml = r => (r.files && r.files.length) ? '<div class="att">' + r.files.map(f => '<button class="link" data-file="' + esc(f.id) + '" type="button">ไฟล์แนบ: ' + esc(f.name) + '</button>').join('') + '</div>' : '';
async function openFile(id) {
  const w = window.open('', '_blank');
  try {
    const j = await api({ action: 'file', token: S.token, id: id });
    if (!j.ok) { if (w) w.close(); if (!authFail(j)) toast(j.message || 'เปิดไฟล์ไม่สำเร็จ'); return; }
    const bin = atob(j.data), u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([u], { type: j.type }));
    if (w && /^(image\/|application\/pdf)/.test(j.type)) w.location = url;
    else { if (w) w.close(); const a = document.createElement('a'); a.href = url; a.download = j.name; a.click(); }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { if (w) w.close(); toast('เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง'); }
}
document.addEventListener('click', ev => { const b = ev.target.closest('[data-file]'); if (b) openFile(b.dataset.file); });

// ----- กรอกใบลา -----
function calcDays() {
  const s = $('#start').value, e = $('#end').value, half = $('#half');
  half.disabled = !(s && e && s === e); if (half.disabled) half.checked = false;
  if (!s || !e) { $('#days').textContent = 'จำนวนวันลา: -'; return null; }
  if (e < s) { $('#days').textContent = 'วันที่สิ้นสุดต้องไม่ก่อนวันที่เริ่ม'; return null; }
  const days = half.checked ? 0.5 : (new Date(e) - new Date(s)) / 86400000 + 1;
  $('#days').textContent = 'จำนวนวันลา: ' + days + ' วัน';
  return days;
}
['start', 'end', 'half'].forEach(id => $('#' + id).addEventListener('input', calcDays));
$('#f').addEventListener('submit', async ev => {
  ev.preventDefault();
  if (!S) return;
  const days = calcDays(), v = id => $('#' + id).value.trim();
  if (!v('start') || !v('end') || !v('reason')) { toast('กรอกข้อมูลที่จำเป็นให้ครบ'); return; }
  if (days === null) { toast('ตรวจสอบวันที่ลาอีกครั้ง'); return; }
  if (!navigator.onLine) { toast('ต้องมีอินเทอร์เน็ตเพื่อส่งใบลา'); return; }
  if (!sendCid) sendCid = crypto.randomUUID(); // ส่งซ้ำด้วยรหัสเดิม กันใบลาซ้ำถ้าเน็ตหลุด
  $('#submit').disabled = true; $('#submit').textContent = 'กำลังส่ง...';
  try {
    let files;
    try { files = await Promise.all(F.map(packFile)); }
    catch (e) { toast('อ่านไฟล์แนบไม่ได้ ลองเลือกไฟล์ใหม่'); $('#submit').disabled = false; $('#submit').textContent = 'ส่งใบลา'; return; }
    const j = await api({ action: 'submit', token: S.token, cid: sendCid, type: $('#type').value, start: v('start'), end: v('end'),
      half: $('#half').checked, reason: v('reason'), phone: v('phone'), files: files });
    if (j.ok) {
      toast('ส่งใบลาแล้ว เลขที่ ' + j.no);
      $('#start').value = $('#end').value = $('#reason').value = ''; $('#half').checked = false; sendCid = null; F = []; renderFiles(); calcDays(); loadMine();
    } else if (!authFail(j)) { toast(j.message || 'ส่งไม่สำเร็จ: ' + j.error); sendCid = null; }
  } catch (e) { toast('เชื่อมต่อไม่ได้ ลองส่งใหม่อีกครั้ง'); }
  $('#submit').disabled = false; $('#submit').textContent = 'ส่งใบลา';
});

// ----- แสดงสถานะใบลา: ไทม์ไลน์ว่าถึงขั้นไหนแล้ว -----
function timeline(r) {
  const open = isOpen(r.status), stopped = r.status === 'ไม่อนุมัติ' || r.status === 'ยกเลิก';
  let h = '<li class="d"><i></i><b>ส่งใบลาแล้ว</b><span>' + fmtTs(r.ts) + '</span></li>';
  r.steps.forEach((s, i) => {
    let cls = 'w', txt = stopped ? '-' : 'ยังไม่ถึงขั้นนี้';
    if (s.role === 'HR') {
      if (r.issued) { cls = 'd'; txt = 'ออกใบลาแล้ว ' + fmtTs(s.at); }
      else if (open && i === r.cur) { cls = 'c'; txt = 'รอ HR ออกใบลา'; }
    } else if (s.decision === 'ok') { cls = 'd'; txt = 'อนุมัติแล้ว ' + fmtTs(s.at); }
    else if (s.decision === 'no') { cls = 'n'; txt = 'ไม่อนุมัติ ' + fmtTs(s.at) + (s.note ? ' · ' + s.note : ''); }
    else if (open && i === r.cur) { cls = 'c'; txt = 'รออนุมัติ'; }
    const who = s.role === 'HR' ? 'HR (ฝ่ายบุคคล)' : s.role + (s.name ? ' · ' + s.name : '');
    h += '<li class="' + cls + '"><i></i><b>' + esc(who) + '</b><span>' + esc(txt) + '</span></li>';
  });
  if (r.status === 'ยกเลิก') h += '<li class="n"><i></i><b>ยกเลิกใบลา</b><span>-</span></li>';
  return '<ul class="tl">' + h + '</ul>';
}
const chipCls = st => st === 'ออกใบลาแล้ว' ? 's-ok' : st === 'ไม่อนุมัติ' ? 's-no' : st === 'ยกเลิก' ? 's-idle' : 's-wait';

async function loadMine() {
  if (!S || !navigator.onLine) return;
  try {
    const j = await api({ action: 'mine', token: S.token });
    if (j.ok) renderMine(j.items); else authFail(j);
  } catch (e) {}
}
function renderMine(items) {
  const el = $('#list');
  if (!items.length) { el.innerHTML = '<p class="empty">ยังไม่มีใบลา กรอกฟอร์มด้านบนเพื่อส่งใบลาฉบับแรก</p>'; return; }
  el.innerHTML = items.map(r =>
    '<div class="item" data-no="' + esc(r.no) + '"><div class="top"><div><div class="t">' + esc(r.type) + ' ' + r.days + ' วัน</div>' +
    '<div class="m">' + rangeTxt(r) + ' · เลขที่ ' + esc(r.no) + '</div></div><span class="chip ' + chipCls(r.status) + '">' + esc(r.status) + '</span></div>' +
    attHtml(r) + timeline(r) + (isOpen(r.status) ? '<button class="link" data-cancel="1" type="button" style="margin-top:8px">ยกเลิกใบลานี้</button>' : '') + '</div>').join('');
}
$('#refresh').addEventListener('click', async () => { if (!navigator.onLine) { toast('ออฟไลน์อยู่'); return; } await loadMine(); toast('อัปเดตสถานะแล้ว'); });
$('#list').addEventListener('click', async ev => {
  const b = ev.target.closest('[data-cancel]'); if (!b) return;
  const no = b.closest('.item').dataset.no;
  if (!confirm('ยกเลิกใบลา ' + no + ' ?')) return;
  try {
    const j = await api({ action: 'cancel', token: S.token, no: no });
    if (j.ok) { toast('ยกเลิกใบลาแล้ว'); loadMine(); } else if (!authFail(j)) toast(j.message || 'ยกเลิกไม่สำเร็จ');
  } catch (e) { toast('เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง'); }
});

// ----- ผู้อนุมัติ (หัวหน้า / MGR / FM) -----
async function loadInbox() {
  if (!S) return;
  const el = $('#iList');
  if (!navigator.onLine) { el.innerHTML = '<p class="empty">ออฟไลน์อยู่ ต้องมีอินเทอร์เน็ต</p>'; return; }
  try {
    const j = await api({ action: 'inbox', token: S.token });
    if (j.ok) { S.inbox = j.count; save(); const b = $('#tBadge'); b.hidden = !(j.count > 0); b.textContent = j.count; renderInbox(j.items); } else authFail(j);
  } catch (e) { el.innerHTML = '<p class="empty">โหลดไม่สำเร็จ ลองใหม่อีกครั้ง</p>'; }
}
function renderInbox(items) {
  const el = $('#iList');
  if (!items.length) { el.innerHTML = '<p class="empty">ไม่มีใบลาที่รอการอนุมัติของคุณ</p>'; return; }
  el.innerHTML = items.map(r =>
    '<div class="item" data-no="' + esc(r.no) + '"><div class="top"><div><div class="t">' + esc(r.name) + '</div><div class="m">' + esc(r.empId) + (r.dept ? ' · ' + esc(r.dept) : '') + '</div></div>' +
    '<span class="chip s-wait">' + esc(r.status) + '</span></div>' +
    '<div style="margin-top:8px"><b>' + esc(r.type) + '</b> ' + r.days + ' วัน<div class="m">' + rangeTxt(r) + '</div>' +
    '<div style="margin-top:4px">' + esc(r.reason) + '</div>' + (r.phone ? '<div class="m">โทร ' + esc(r.phone) + '</div>' : '') + '</div>' + attHtml(r) + timeline(r) +
    '<label for="n_' + esc(r.no) + '">หมายเหตุ / เหตุผลที่ไม่อนุมัติ (ไม่บังคับ)</label><input id="n_' + esc(r.no) + '" class="note" autocomplete="off">' +
    '<div class="acts2"><button class="bt no" data-d="no" type="button">ไม่อนุมัติ</button><button class="bt ok" data-d="ok" type="button">อนุมัติ</button></div></div>').join('');
}
$('#iRefresh').addEventListener('click', loadInbox);
$('#iList').addEventListener('click', async ev => {
  const b = ev.target.closest('[data-d]'); if (!b) return;
  const card = b.closest('.item'), dec = b.dataset.d;
  if (dec === 'no' && !confirm('ยืนยันไม่อนุมัติใบลานี้?')) return;
  card.querySelectorAll('button').forEach(x => x.disabled = true);
  try {
    const j = await api({ action: 'decide', token: S.token, no: card.dataset.no, decision: dec, note: card.querySelector('.note').value.trim() });
    if (j.ok) { toast(dec === 'ok' ? 'อนุมัติแล้ว ส่งต่อขั้นถัดไป' : 'ไม่อนุมัติแล้ว'); loadInbox(); }
    else if (!authFail(j)) { toast(j.message || 'ไม่สำเร็จ: ' + j.error); loadInbox(); }
  } catch (e) { toast('เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง'); card.querySelectorAll('button').forEach(x => x.disabled = false); }
});

// ----- ออนไลน์/ออฟไลน์ + PWA -----
function net() { $('#netBanner').style.display = navigator.onLine ? 'none' : 'block'; }
window.addEventListener('online', () => { net(); loadMe(); loadMine(); });
window.addEventListener('offline', net);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadMe(); if (S) loadMine(); } });
let deferred;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('#installBtn').style.display = 'block'; });
$('#installBtn').addEventListener('click', async () => {
  if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $('#installBtn').style.display = 'none';
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

// ----- เริ่มต้น -----
net(); calcDays();
if (S && S.token && S.emp) { showApp(); if (S.emp.mustChange && navigator.onLine) openPin(true); loadMe(); loadMine(); }
else { S = null; showLogin(''); }
</script>
